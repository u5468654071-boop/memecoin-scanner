name: memecoin-paper
x-common: &common
  build: .
  image: memecoin-scanner:0.8.0
  env_file: .env.server
  volumes:
    - state:/data
    - ./paper-policy.json:/app/paper-policy.json:ro
    - ./profiles.json:/app/profiles.json:ro
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  restart: unless-stopped
  stop_signal: SIGINT
  stop_grace_period: 30s
  mem_limit: 512m
  cpus: 1.0
  pids_limit: 128
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
services:
  scanner:
    <<: *common
    command: [scan, --profiles, /app/profiles.json]
    healthcheck:
      test: [CMD, python, server.py, health, --service, scanner]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
  paper:
    <<: *common
    command: [paper, --profiles, /app/profiles.json]
    healthcheck:
      test: [CMD, python, server.py, health, --service, paper]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
  telegram:
    <<: *common
    profiles: [telegram]
    env_file:
      - path: .env.telegram
        required: false
    entrypoint: [python, telegram_notifications.py]
    command: [run]
    healthcheck:
      test: [CMD, python, telegram_notifications.py, health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  state:
