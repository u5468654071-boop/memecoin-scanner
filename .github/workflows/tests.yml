name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-stream.txt
      - run: python -m unittest discover -s tests -v
      - run: python memecoin_scanner.py --help
      - run: python server.py --help
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env.server
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose run --rm --no-deps --entrypoint python paper -m unittest discover -s tests -v
      - name: Persistent paper account in a read-only container
        run: |
          docker compose run --rm --no-deps -e JUPITER_API_KEY=offline-fixture paper paper --cycles 1
          docker compose run --rm --no-deps -e JUPITER_API_KEY=offline-fixture paper paper --cycles 1
          docker compose run --rm --no-deps paper report
